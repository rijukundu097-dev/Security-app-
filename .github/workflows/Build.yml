name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q sentinel.zip
      - name: Get Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
      - name: Build
        run: ./gradle-8.7/bin/gradle -p sentinel :app:assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la sentinel/app/build/outputs/apk/release/
          APK=$(ls sentinel/app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in
            *unsigned*) echo "APK is unsigned - old sentinel.zip is still in the repo"; exit 1;;
          esac
          cp "$APK" Sentinel.apk
          gh release create v0.1.${{ github.run_number }} Sentinel.apk \
            --title "Sentinel build ${{ github.run_number }}" \
            --notes "Sentinel Antivirus APK"
